services:
  web:
    build:
      context: .
      args:
        # Bakas in i förrenderade sidor (delningsbilder, robots.txt) – läses från .env.
        SITE_URL: ${SITE_URL:-}
    image: statlin-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    volumes:
      # Databas och uppladdade bilder/dokument – säkerhetskopiera den här volymen.
      - statlin-data:/data

volumes:
  statlin-data:
